<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vogue Gifts Under $100</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* solid white so the inverted price text has something to invert in empty areas */
  #board { position: fixed; inset: 0; background: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  #board img {
    position: absolute; left: 0; top: 0; cursor: grab; -webkit-user-drag: none;
    /* placed with transform (not left/top) so movement is sub-pixel smooth instead of snapping pixel to pixel */
    transition: width .25s ease, height .25s ease, transform .25s ease, opacity .2s ease;
  }
  #board img.dragging { cursor: grabbing; transition: none; }
  #board img.new { animation: pop 1.1s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes pop { from { opacity: 0; scale: .94; } to { opacity: 1; scale: 1; } }   /* uses `scale` so it keeps the tilt */
  #home { position: fixed; top: 12px; left: 18px; z-index: 100000; font: 14px Times, serif; color: #000; }

  /* Running total of every gift on screen (top center) */
  #total {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100000;
    font: 18px Times, serif; color: #000; white-space: nowrap; pointer-events: none;
    font-variant-numeric: tabular-nums;
    display: none;   /* only shown while the Prices toggle is on */
  }
  body.prices-on #total { display: block; }

  /* Price toggle (top right) */
  #toggles { position: fixed; top: 10px; right: 18px; z-index: 100000; display: flex; gap: 18px; }
  .toggle {
    display: flex; align-items: center; gap: 8px;
    font: 14px Times, serif; color: #000; background: none; border: 0; padding: 4px 0; cursor: pointer;
  }
  .toggle .track {
    width: 34px; height: 18px; border-radius: 9px; border: 1px solid #000; position: relative;
    transition: background .2s;
  }
  .toggle .knob {
    position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: #000; transition: left .2s, background .2s;
  }
  .toggle[aria-pressed="true"] .track { background: #000; }
  .toggle[aria-pressed="true"] .knob { left: 18px; background: #fff; }

  /* Float mode: everything drifts and spins slowly; physics moves it every frame, so no transitions */
  body.floating #board img { transition: opacity .2s ease; }
  body.floating #board img, body.floating #board .name { will-change: transform; backface-visibility: hidden; }
  /* Product names as black blocks with white text (only shown in float mode) */
  #board .name {
    position: absolute; left: 0; top: 0; display: none; white-space: nowrap; cursor: grab;
    background: #000; color: #fff; padding: 1px 6px 3px;
    font: 18px Times, "Times New Roman", serif; line-height: 1.1;
  }
  body.floating #board .name { display: block; }
  #board .name.dragging { cursor: grabbing; }
  #board .name.new { animation: pop 1.1s cubic-bezier(.22,.61,.36,1) .25s both; }   /* name follows just after its image */

  /* While prices are on, the hovered image is swapped for its price */
  #board img.priced { opacity: 0; }
  #priceLabel {
    position: absolute; display: none; pointer-events: none;
    align-items: center; justify-content: center; text-align: center;
    font-family: "Didot", "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
    font-weight: 700; line-height: 1; letter-spacing: -0.02em; white-space: nowrap;
    /* inverts whatever is behind it: black on white, white on black, opposite colors on images */
    color: #fff; mix-blend-mode: difference;
  }
  /* In float mode the price is a black block with white text, turned with its image */
  #priceLabel.block {
    width: auto !important; height: auto !important; padding: .04em .18em .1em;
    background: #000; color: #fff; mix-blend-mode: normal;
    font-family: Times, "Times New Roman", serif; font-weight: 400; letter-spacing: 0;
  }
</style>
</head>
<body>
<a id="home" href="../index.html">Home</a>
<div id="total" aria-live="polite">Total: $0</div>
<div id="toggles">
  <button id="floatToggle" class="toggle" type="button" aria-pressed="false">
    <span>Float</span><span class="track"><span class="knob"></span></span>
  </button>
  <button id="priceToggle" class="toggle" type="button" aria-pressed="false">
    <span>Prices</span><span class="track"><span class="knob"></span></span>
  </button>
</div>
<div id="board"></div>
<script>
// [file name, width, height, price] for every image in images/ (prices from Vogue's "100 Gifts Under $100")
const ALL = [["2027-panama-weekly-journal",327,520,"$85","2027 Panama Weekly Journal"],["align-pants",168,520,"$98","Align pants"],["aristidis-hairbrush",358,520,"$75","Aristidis Hairbrush"],["armenia-burning-papers",520,156,"$32","Armenia burning papers"],["art-of-backgammon",520,339,"$85","Art of Backgammon"],["asterales-earrings",520,248,"$85","Asterales earrings"],["baies-berries-classic-candle",389,520,"$90","Baies (Berries) Classic candle"],["banho-soap",520,332,"$26","Banho Soap"],["baume-des-muses-lip-balm",520,458,"$59","Baume des Muses Lip Balm"],["big-effing-clip",520,287,"$36","Big Effing clip"],["bistrot-bottle-opener",227,520,"$45","Bistrot bottle opener"],["bistrot-cake-slicer",145,520,"$44","Bistrot cake slicer"],["boat-and-tote",436,520,"$50","Boat and Tote"],["bug-stripe-towels",440,520,"$32","Bug stripe towels"],["calm-stress-relief-herbal-tea",337,520,"$19","Calm stress relief herbal tea"],["capri-glass-tray",520,324,"$85","Capri glass tray"],["cobra-salt-pepper-shaker-set",502,520,"$95","Cobra salt & pepper shaker set"],["demi-basket-weaving-kit",386,520,"$98","Demi basket weaving kit"],["discovery-box",279,520,"$85","Discovery Box"],["eau-rose-refillable-solid-parfum",468,520,"$76","Eau Rose Refillable Solid Parfum"],["egyptian-drinking-glass",520,341,"$98","Egyptian drinking glass"],["essential-lip-contour-trio",340,520,"$64","Essential Lip Contour Trio"],["gardana-clogs",520,197,"$75","Gardana clogs"],["gio-espresso-set",520,329,"$38","Gio espresso set"],["hand-crafted-italian-toothbrush",204,520,"$20","Hand-Crafted Italian Toothbrush"],["henna-brooch",487,520,"$80","Henna brooch"],["hydra-beauty-camellia-water-cream",162,520,"$65","Hydra Beauty Camellia Water Cream"],["large-bar-soap",520,219,"$70","Large Bar Soap"],["le-tarot-de-marseille-cards",308,520,"$70","Le Tarot de Marseille cards"],["lomography-reloadable-camera",520,293,"$95","Lomography reloadable camera"],["london-eye-mask",520,395,"$98","London eye mask"],["luminous-deep-hydration-lifting-masks",431,520,"$100","Luminous Deep Hydration Lifting Masks"],["melograno-home-diffuser",520,352,"$95","Melograno home diffuser"],["memo-glasses",520,149,"$60","Memo glasses"],["met-logo-sweatshirt",520,419,"$75","Met logo sweatshirt"],["montreal-pillow",520,497,"$84","Montreal pillow"],["no-4-cheers-matchboxes",520,435,"$6","No. 4 Cheers! matchboxes"],["no-4-comb",384,520,"$35","No. 4 Comb"],["ope-ra-incense",520,228,"$75","Opéra incense"],["parker-delicate-necklace",384,520,"$63","Parker delicate necklace"],["picual-arbequina-olive-oil",270,520,"$66","Picual & Arbequina olive oil"],["pocket-nylon-hair-brush",520,207,"$100","Pocket Nylon Hair Brush"],["refillable-lipstick-case",169,520,"$43","Refillable Lipstick Case"],["relax-fluid-body-cream",225,520,"$65","Relax Fluid Body Cream"],["rituals-coffee",520,229,"$51","Rituals coffee"],["river-mittens",478,520,"$79","River mittens"],["roma-heirloom-tomato-candle",459,520,"$68","Roma Heirloom Tomato candle"],["rouge-allure",270,520,"$53","Rouge Allure"],["rouge-g-lipstick-case",221,520,"$43","Rouge G Lipstick Case"],["sajou-complete-sewing-set",520,466,"$83","Sajou complete sewing set"],["scuff-slippers",520,175,"$100","Scuff slippers"],["softening-hand-wash",227,520,"$85","Softening Hand Wash"],["speedcat-sneakers",520,287,"$100","Speedcat sneakers"],["stations",346,520,"$28","Stations"],["sticker-book",377,520,"$35","Sticker Book"],["the-cashmere-beanie",520,436,"$88","The Cashmere beanie"],["the-collegiate-socks",243,520,"$32","The Collegiate socks"],["the-crack-of-dawn-hat",520,511,"$75","The Crack of Dawn hat"],["the-flying-ointment",334,520,"$42","The Flying Ointment"],["the-moisturizing-soft-cream",483,520,"$100","The Moisturizing Soft Cream"],["the-only-thing-there-is-to-want-a-memoir-of-three-loves",346,520,"$14","The Only Thing There Is to Want: A Memoir of Three Loves"],["the-original-sweater",413,520,"$98","The Original sweater"],["the-pocket-duo",520,383,"$48","The Pocket Duo"],["the-sally-luggage-tag",191,520,"$80","The Sally luggage tag"],["the-yves-socks",379,520,"$35","The Yves socks"],["tube-huggie-hoops",520,389,"$98","Tube huggie hoops"],["verdant-incense",148,520,"$60","Verdant incense"],["victorian-ration-cup",520,384,"$72","Victorian ration cup"],["wrinklit-led-mask",485,520,"$99","Wrinklit LED Mask"],["annual-digital-subsciption-tote",409,520,"$18","annual digital subsciption + tote"],["beaded-tassel-necklace",198,520,"$99","beaded tassel necklace"],["cable-knit-gloves",512,520,"$90","cable-knit gloves"],["cosy-slipper-socks",473,520,"$79","cosy slipper socks"],["enamel-flower-jug",520,518,"$48","enamel flower jug"],["espresso-maker",452,520,"$55","espresso maker"],["felt-heart-ornament",397,520,"$15","felt heart ornament"],["flower-napkin-set",520,518,"$32","flower napkin set"],["fringed-tie-style-scarf",131,520,"$36","fringed tie-style scarf"],["glazed-panettone",520,479,"$36","glazed panettone"],["leather-card-holder",520,376,"$98","leather card holder"],["leather-pocket-emptiers",520,333,"$85","leather pocket emptiers"],["lemon-squeezer-swan",520,345,"$48","lemon squeezer swan"],["lined-leather-gloves",443,520,"$48","lined leather gloves"],["mini-oval-tray",520,273,"$58","mini oval tray"],["mini-round-cocotte",520,355,"$22","mini round cocotte"],["monogram-waffle-pouch",520,335,"$78","monogram waffle pouch"],["mushrooms-matchbox",440,520,"$5","mushrooms matchbox"],["pajama-set",233,520,"$90","pajama set"],["personalized-heritage-olive-oil",319,520,"$88","personalized heritage olive oil"],["picture-frame",425,520,"$86","picture frame"],["round-decorative-vase",468,520,"$80","round decorative vase"],["salt-cellar-set",520,338,"$100","salt cellar set"],["slim-crew-sweater",372,520,"$68","slim crew sweater"],["small-jewelry-box",520,216,"$95","small jewelry box"],["square-scarf",350,520,"$36","square scarf"],["steel-plier-stapler",520,278,"$56","steel plier stapler"],["stripe-locket",313,520,"$75","stripe locket"],["stripe-pajama-set",520,333,"$85","stripe pajama set"],["umbrella",384,520,"$45","umbrella"],["wave-matchbox-sleeve",520,269,"$60","wave matchbox sleeve"],["x-juliska-graham-cocktail-pick-set",203,520,"$78","x Juliska Graham Cocktail Pick Set"]];
const SHRINK = 1;             // existing images keep their size (set below 1, e.g. 0.98, to shrink them)
const START_COUNT = 5;        // images shown on first load, like the reference collage

const board = document.getElementById('board');
const placed = [];            // { el, cx, cy, scale, w, h }
let pool = ALL.map((_, i) => i);
let zTop = 1;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
shuffle(pool);

// Clothing (garments, shoes, hats, gloves, scarves, socks) shows a bit bigger than other items.
const CLOTHING = new Set(['align-pants','cable-knit-gloves','cosy-slipper-socks','fringed-tie-style-scarf',
  'gardana-clogs','lined-leather-gloves','met-logo-sweatshirt','pajama-set','river-mittens','scuff-slippers',
  'slim-crew-sweater','speedcat-sneakers','square-scarf','stripe-pajama-set','the-cashmere-beanie',
  'the-collegiate-socks','the-crack-of-dawn-hat','the-original-sweater','the-yves-socks']);
const CLOTHING_SCALE = 1.2;   // 20% bigger

// Every image gets roughly the same visual area, based on the window size.
function baseSize(w, h, file) {
  const s = Math.min(innerWidth, innerHeight) * 0.27 * 1.15 * (CLOTHING.has(file) ? CLOTHING_SCALE : 1);
  let bw = s * Math.sqrt(w / h), bh = s * Math.sqrt(h / w);
  const maxH = innerHeight * 0.55 * 1.15;   // 15% bigger than before
  if (bh > maxH) { bw *= maxH / bh; bh = maxH; }
  return [bw, bh];
}

function render(p) {
  const w = p.w * p.scale, h = p.h * p.scale;
  if (!p.isName) {
    p.el.style.width = w + 'px';
    p.el.style.height = h + 'px';
  }
  p.el.style.transform = 'translate3d(' + (p.cx - w / 2) + 'px,' + (p.cy - h / 2) + 'px,0) rotate(' + (p.angle || 0) + 'rad)';
  if (hovered === p) placeLabel(p);
}

// ---- Price toggle: when on, hovering an image shows its price in big text instead ----
let showPrices = false;
let hovered = null;
const toggle = document.getElementById('priceToggle');
const label = document.createElement('div');
label.id = 'priceLabel';
board.appendChild(label);

function placeLabel(p) {
  const w = p.w * p.scale, h = p.h * p.scale;
  label.textContent = p.price;
  if (floating) {
    // black block with white text, centered on the image and turned with it
    label.classList.add('block');
    label.style.left = '0px';
    label.style.top = '0px';
    label.style.transform = 'translate3d(' + p.cx + 'px,' + p.cy + 'px,0) translate(-50%, -50%) rotate(' + (p.angle || 0) + 'rad)';
    label.style.fontSize = Math.max(32, Math.min(w / (p.price.length * 0.55), h * 0.45)) + 'px';
    label.style.zIndex = 99999;
    label.style.display = 'flex';
    return;
  }
  label.classList.remove('block');
  label.style.transform = 'rotate(' + (p.angle || 0) + 'rad)';   // follows the image's tilt
  label.style.left = (p.cx - w / 2) + 'px';
  label.style.top = (p.cy - h / 2) + 'px';
  label.style.width = w + 'px';
  label.style.height = h + 'px';
  // big text, sized to the image it replaces
  label.style.fontSize = Math.max(40, Math.min(w / (p.price.length * 0.6), h * 0.6)) + 'px';
  label.style.zIndex = 99999;   // always readable, above other images
  label.style.display = 'flex';
}
const HOVER_DELAY = 180;   // ms before the price shows
let hoverTimer = null;
// Hovering an image (in every mode) shows its price if Prices is on, and brings in two new images.
function onHover(p) {
  if (drag) return;
  showPrice(p);
  addPair();
}
function showPrice(p) {
  if (!showPrices) return;
  hidePrice();
  hovered = p;
  p.el.classList.add('priced');
  placeLabel(p);
  label.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });   // fade in
}
function hidePrice() {
  if (hovered) hovered.el.classList.remove('priced');
  hovered = null;
  label.style.display = 'none';
}
toggle.addEventListener('click', () => {
  showPrices = !showPrices;
  toggle.setAttribute('aria-pressed', showPrices);
  document.body.classList.toggle('prices-on', showPrices);   // shows/hides the total
  if (!showPrices) hidePrice();
});

// Pick a random spot anywhere on the screen (image stays fully visible).
// If `awayFrom` is given, only accept spots far from that point.
function randomSpot(w, h, awayFrom) {
  const pad = 20;
  const rand = () => [
    pad + w / 2 + Math.random() * Math.max(1, innerWidth - w - pad * 2),
    pad + h / 2 + Math.random() * Math.max(1, innerHeight - h - pad * 2)
  ];
  // never drop a new image right under the mouse (it would instantly count as hovered)
  const underMouse = s => Math.abs(s[0] - mouse[0]) < w / 2 + 10 && Math.abs(s[1] - mouse[1]) < h / 2 + 10;
  // a different random gap every time, so pairs don't always land in opposite corners
  const minDist = awayFrom ? Math.hypot(innerWidth, innerHeight) * (0.18 + Math.random() * 0.2) : 0;
  // and never in the same row or column as the first one (so they don't look lined up)
  const lined = s => awayFrom && (Math.abs(s[0] - awayFrom[0]) < innerWidth * 0.12 || Math.abs(s[1] - awayFrom[1]) < innerHeight * 0.12);
  let fallback = null, farD = -1;
  for (let t = 0; t < 80; t++) {
    const s = rand();
    if (underMouse(s) || lined(s)) continue;
    const d = awayFrom ? Math.hypot(s[0] - awayFrom[0], s[1] - awayFrom[1]) : 0;
    if (d >= minDist) return s;                 // first random spot that is far enough
    if (d > farD) { farD = d; fallback = s; }   // otherwise remember the farthest one
  }
  return fallback || rand();
}
let mouse = [-9999, -9999];
window.addEventListener('pointermove', e => { mouse = [e.clientX, e.clientY]; }, { passive: true });

function addImage(cx, cy, animate, awayFrom) {
  if (!pool.length) return null;
  const [file, iw, ih, price, name] = ALL[pool.pop()];
  const [w, h] = baseSize(iw, ih, file);
  if (cx == null) [cx, cy] = randomSpot(w, h, awayFrom);
  const el = document.createElement('img');
  el.src = 'images/' + file + '.png';
  el.alt = file.replace(/-/g, ' ');
  el.draggable = false;
  if (animate) el.className = 'new';
  el.style.zIndex = zTop++;
  // every image sits at a slight random tilt (about ±4°), never perfectly level
  const tilt = (Math.random() < 0.5 ? -1 : 1) * (0.015 + Math.random() * 0.09);   // about 1°–6°
  const p = { el, cx, cy, scale: 1, w, h, price, name, angle: tilt, tilt };
  // short pause before the price appears, so passing over an image doesn't flash it
  el.addEventListener('pointerenter', () => { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => onHover(p), HOVER_DELAY); });
  el.addEventListener('pointerleave', () => {
    clearTimeout(hoverTimer);
    if (hovered === p && !(drag && drag.p === p)) hidePrice();
  });
  render(p);
  board.appendChild(el);
  placed.push(p);
  makeDraggable(p);
  if (floating) { drift(p); addName(p); }
  updateTotal();
  return p;
}

// Total price of every gift currently on the page.
const totalEl = document.getElementById('total');
function updateTotal() {
  const sum = placed.reduce((t, p) => t + parseFloat(p.price.replace(/[^0-9.]/g, '')), 0);
  totalEl.textContent = 'Total: $' + sum.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// Shrink every image already on the page by 2%, then add one new image.
function addWithShrink(awayFrom) {
  if (!pool.length) return null;
  for (const p of placed) { p.scale *= SHRINK; render(p); }
  return addImage(null, null, true, awayFrom);
}

// Two new images, placed far apart from each other.
function addPair() {
  const a = addWithShrink();
  // the second one follows a moment later, at a random delay, so they don't pop in together
  setTimeout(() => addWithShrink(a ? [a.cx, a.cy] : null), 450 + Math.random() * 450);
}

// One drag at a time, tracked on the whole window so fast moves never "drop" the image.
let drag = null;   // { p, startX, startY, offX, offY, moved, vx, vy, t }
function makeDraggable(p) {
  p.el.addEventListener('pointerdown', e => {
    e.preventDefault();
    p.el.classList.add('dragging');
    p.el.style.zIndex = p.isName ? nameZ++ : zTop++;
    drag = { p, startX: e.clientX, startY: e.clientY, offX: e.clientX - p.cx, offY: e.clientY - p.cy,
             moved: false, vx: 0, vy: 0, t: performance.now() };
  });
}
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 4) return;
  drag.moved = true;
  const nx = e.clientX - drag.offX, ny = e.clientY - drag.offY;
  // remember how fast it is moving, so letting go in float mode throws it
  const now = performance.now(), dt = Math.max(1, now - drag.t) / 1000;
  drag.vx = drag.vx * 0.5 + (nx - drag.p.cx) / dt * 0.5;
  drag.vy = drag.vy * 0.5 + (ny - drag.p.cy) / dt * 0.5;
  drag.t = now;
  drag.p.cx = nx; drag.p.cy = ny;
  render(drag.p);
});
function endDrag() {
  if (!drag) return;
  const { p, moved, vx, vy, t } = drag;
  drag = null;
  p.el.classList.remove('dragging');
  if (floating) {
    // a gentle toss: only if the mouse was still moving when let go, and capped low
    const sp = performance.now() - t < 80 ? Math.hypot(vx, vy) : 0, cap = 260;
    if (moved && sp > 40) { const k = 0.6 * Math.min(1, cap / (sp * 0.6)); p.vx = vx * k; p.vy = vy * k; }
    else drift(p);
  }
}

// ---- Float toggle: images and name blocks hang almost still in space; they only really move when bumped ----
let floating = false;
let nameZ = 50000;   // name blocks stack above images (images count up from 1)
const names = [];   // name blocks: { el, cx, cy, w, h, scale, angle, vx, vy, va, isName }
const floatToggle = document.getElementById('floatToggle');

const DRIFT_SPEED = 2;      // px per second when left alone (barely moving)
const DRIFT_SPIN = 0.02;    // radians per second when left alone
const PUSH = 0.25;          // how much of a moving thing's speed passes to what it bumps
const SETTLE = 0.04;        // bumped things lose ~96% of extra speed each second

// very slow random drift and spin
function drift(p) {
  const a = Math.random() * Math.PI * 2, s = DRIFT_SPEED * (0.5 + Math.random());
  p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
  p.va = (Math.random() - 0.5) * 2 * DRIFT_SPIN;
}

// a black block with the product's name, starting near its image
function addName(p) {
  if (p.nameBlock) return;
  const el = document.createElement('div');
  el.className = 'name new';
  el.textContent = p.name;
  el.style.zIndex = nameZ++;   // names always sit above every image
  board.appendChild(el);
  const n = { el, cx: p.cx + (Math.random() - 0.5) * p.w * 0.6, cy: p.cy + (Math.random() - 0.5) * p.h * 0.6,
              w: el.offsetWidth, h: el.offsetHeight, scale: 1, angle: (Math.random() - 0.5) * 0.9, isName: true };
  n.cx = Math.max(n.w / 2 + 10, Math.min(innerWidth - n.w / 2 - 10, n.cx));
  n.cy = Math.max(n.h / 2 + 10, Math.min(innerHeight - n.h / 2 - 10, n.cy));
  drift(n);
  p.nameBlock = n;
  names.push(n);
  makeDraggable(n);
  render(n);
}

// half-size of the turned box on screen
function extent(p) {
  const w = p.w * p.scale, h = p.h * p.scale;
  const c = Math.abs(Math.cos(p.angle)), s = Math.abs(Math.sin(p.angle));
  return [(w * c + h * s) / 2, (w * s + h * c) / 2];
}

// keep everything on screen: bounce softly off the edges
function bounce(p) {
  const [hw, hh] = extent(p);
  if (p.cx - hw < 0 && p.vx < 0) p.vx = -p.vx * 0.5;
  if (p.cx + hw > innerWidth && p.vx > 0) p.vx = -p.vx * 0.5;
  if (p.cy - hh < 0 && p.vy < 0) p.vy = -p.vy * 0.5;
  if (p.cy + hh > innerHeight && p.vy > 0) p.vy = -p.vy * 0.5;
}

// Something moving (being dragged, tossed, or already bumped) nudges whatever it runs into.
// Things sitting still never push each other, so the collage can stay overlapped.
function bumps(all, now) {
  for (const a of all) {
    const dragged = drag && drag.p === a && drag.moved;
    const avx = dragged ? (now - drag.t < 80 ? drag.vx : 0) : a.vx;
    const avy = dragged ? (now - drag.t < 80 ? drag.vy : 0) : a.vy;
    if (Math.hypot(avx, avy) < 30) continue;
    const [ahw, ahh] = extent(a);
    for (const b of all) {
      if (b === a || (drag && drag.p === b)) continue;
      const [bhw, bhh] = extent(b);
      const dx = b.cx - a.cx, dy = b.cy - a.cy;
      if (Math.abs(dx) > (ahw + bhw) * 0.7 || Math.abs(dy) > (ahh + bhh) * 0.7) continue;
      const d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
      const rel = (avx - b.vx) * nx + (avy - b.vy) * ny;   // closing speed
      if (rel <= 0) continue;
      const j = rel * PUSH;
      b.vx += nx * j; b.vy += ny * j;
      b.va += (Math.random() - 0.5) * j * 0.004;            // a hint of spin
      if (!dragged) { a.vx -= nx * j * 0.5; a.vy -= ny * j * 0.5; }
    }
  }
}

let lastT = 0;
function step(t) {
  if (!floating) return;
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  const all = placed.concat(names);
  bumps(all, performance.now());
  const k = Math.pow(SETTLE, dt);
  for (const p of all) {
    if (drag && drag.p === p) continue;
    p.cx += p.vx * dt; p.cy += p.vy * dt; p.angle += p.va * dt;
    // after a bump, settle back to the barely-there drift
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > DRIFT_SPEED * 1.5) { const f = Math.max(k, DRIFT_SPEED / sp); p.vx *= f; p.vy *= f; }
    if (Math.abs(p.va) > DRIFT_SPIN) p.va *= Math.max(k, DRIFT_SPIN / Math.abs(p.va));
    bounce(p);
    render(p);
  }
  requestAnimationFrame(step);
}

floatToggle.addEventListener('click', () => {
  floating = !floating;
  floatToggle.setAttribute('aria-pressed', floating);
  document.body.classList.toggle('floating', floating);
  if (floating) {
    for (const p of placed) { drift(p); addName(p); }
    lastT = performance.now();
    requestAnimationFrame(step);
  } else {
    // back to the still collage: images straighten up where they are, names hide
    for (const p of placed) { p.angle = p.tilt; render(p); }
  }
  if (hovered) placeLabel(hovered);
});
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

// First load: a loose, overlapping cluster in the middle, like the reference.
function startLayout() {
  const cols = 5, rows = 3;
  const cellW = innerWidth * 0.7 / cols, cellH = innerHeight * 0.66 / rows;
  const left = innerWidth * 0.15, top = innerHeight * 0.17;
  const cells = shuffle([...Array(cols * rows).keys()]).slice(0, START_COUNT);
  for (const c of cells) {
    const cx = left + (c % cols + 0.5) * cellW + (Math.random() - 0.5) * cellW * 0.4;
    const cy = top + (Math.floor(c / cols) + 0.5) * cellH + (Math.random() - 0.5) * cellH * 0.4;
    addImage(cx, cy, false);
  }
}
startLayout();
</script>
