<style>
  /* Same layout and hierarchy as the Forbes Vetted gift guide, with every image removed */
  body { margin: 0; background: #fff; color: #000; font: 16px/1.5 Helvetica, Arial, sans-serif; }
  /* one sans-serif typeface for everything, including form controls */
  button, select, input { font-family: inherit; }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }
  #home { display: inline-block; margin: 18px 0 0; font-size: 14px; }

  /* Article header */
  .crumbs { margin: 22px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .crumbs span + span::before { content: "›"; margin: 0 10px; font-weight: 400; }
  .head { max-width: 760px; margin: 48px auto 0; text-align: center; }
  .year { display: inline-block; background: #c4161c; color: #fff; font-size: 12px; font-weight: 700; padding: 1px 7px; }
  .kicker { margin: 14px 0 0; font-size: 28px; line-height: 1.1; }
  h1 { margin: 2px 0 0; font-size: 52px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
  .meta { max-width: 760px; margin: 36px auto 0; }
  .disclosure { font-size: 17px; }
  .disclosure a { font-weight: 700; }
  .date { margin-top: 18px; padding-bottom: 18px; border-bottom: 1px solid #ddd; font-size: 15px; color: #333; }

  /* Gift grid */
  .grid-section { margin: 56px 0 80px; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; }
  .controls label { position: relative; }
  .controls select {
    appearance: none; -webkit-appearance: none; min-width: 210px; padding: 12px 40px 12px 18px;
    border: 1px solid #ccc; border-radius: 30px; background: #fff; font-size: 16px; cursor: pointer;
  }
  .controls label::after { content: "⌄"; position: absolute; right: 18px; top: 7px; font-size: 18px; pointer-events: none; }
  .count-row { display: flex; justify-content: space-between; margin: 18px 0 16px; padding-top: 14px; border-top: 1px solid #ddd; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px)  { .grid { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 40px; } }
  @media (max-width: 480px)  { .grid { grid-template-columns: 1fr; } .wrap { padding: 0 16px; } }

  .card { position: relative; display: flex; flex-direction: column; background: #f6f6f6; padding: 20px; }
  .card h6 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 600; }
  /* the description sits right under the name, where "Read More" used to be */
  .card .desc { margin: 12px 0 20px; font-size: 15px; line-height: 1.45; }
  .card .desc p { margin: 0 0 .7em; }
  .card .desc p:last-child { margin-bottom: 0; }
  .card h6 + .shop { margin-top: 20px; }   /* cards without a description yet */
  .card .shop {
    margin-top: auto; display: block; padding: 11px 12px; background: #c4161c; color: #fff;
    text-align: center; text-decoration: none; font-size: 14px; font-weight: 700; border-radius: 3px;
  }

  .show-more { display: block; margin: 36px auto 0; padding: 12px 36px; border: 1px solid #000; border-radius: 30px; background: #fff; font-size: 15px; cursor: pointer; }
  .top { display: block; width: fit-content; margin: 18px auto 0; font-size: 13px; }
</style>
</head>

const GIFTS = [{"name": "Hyperice x Nike Air Zoom Hyperslide", "category": "Gadgets & Gear", "price": 249.0, "retailer": "Best Buy", "shop": "$249 At Best Buy", "url": "https://bestbuy.7tiv.net/c/1201867/614286/10014?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.bestbuy.com%2Fproduct%2Fhyperice-nike-air-zoom-hyperslide-m8-w9-black%2FJ3GTV2W6SL", "description": "Treat the sports lover to this innovative slide: Responsive Nike Air Zoom cushioning in the sole combines with Hyperice technology in the strap to deliver three levels of heat and vibration massage. The result? “They provide therapeutic relief for sore feet,” says Bridget Chapman, deputy sleep and wellness editor. “A great gift for athletes or anybody who spends hours standing.”"}, {"name": "Aura Astra Frame", "category": "Home & Holiday", "price": 399.0, "retailer": "Aura Frames", "shop": "$399 At Aura Frames", "url": "https://aurahome.sjv.io/c/1201867/1805509/21436?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fauraframes.com%2Fdigital-frames%2Fcolor%2Fastra-moonstone", "description": "Decked out in more than 15,000 glittering Swarovski crystals—perfect for showcasing special moments—Aura’s digital photo frame has a 12-inch LCD display, a built-in speaker, an interactive touch bar and a slim profile, at only 1.1 inches thick. In addition to holding unlimited photos and videos, family and friends can add photos to the frame from anywhere."}, {"name": "Dyson Airsmooth", "category": "Little Luxuries", "price": 250.0, "retailer": "Ulta", "shop": "$250 At Ulta", "url": "https://ulta.ztk5.net/c/1201867/164999/3037?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.ulta.com%2Fp%2Fairsmooth-styling-dryer-brush-pimprod2061273%3F", "description": "Beauty lovers will swoon for Dyson’s just-launched styling brush. “For anyone trying to re-create a frizz-free yet bouncy blowout at home, look no further than the new Dyson Airsmooth,” says Jennifer Ferrise, senior features and special projects editor. “It features PivotFlex bristles that glide easily through the hair (without snagging), drying and shaping your strands in a matter of minutes.”"}, {"name": "Apple iPhone Duo", "category": "Gadgets & Gear", "price": 1999.0, "retailer": "Best Buy", "shop": "$1,999 And Up At Best Buy", "url": "https://bestbuy.7tiv.net/c/1201867/614286/10014?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.bestbuy.com%2Fproduct%2Fapple-iphone-duo-512gb-star-white-verizon%2FJCQ6HQT438", "description": "One of the most coveted gifts of the year (if you can get your hands on it), Apple’s new iPhone Duo has the largest iPhone display ever, with a foldable design and a titanium frame. The 48-megapixel Dual Fusion camera system allows you to snap photos from front to back, and performance comes courtesy of a vapor-cooled A20 Pro chip."}, {"name": "Dorsey Cecilia Earrings", "category": "Little Luxuries", "price": 325.0, "retailer": "Dorsey", "shop": "$325 At Dorsey", "url": "https://www.awin1.com/cread.php?awinmid=108656&awinaffid=1944237&campaign=&clickref=6ad7b29924b5da812673fc62&ued=https%3A%2F%2Fwww.shopdorsey.com%2Fcollections%2Fcecilia-earrings%2Fproducts%2Fcecilia-earrings-in-moissanite-gold%3Fvariant%3D47288287265018&platform=pl", "description": "Inspired by the Georgian era, these sophisticated white moissanite earrings come in four carat sizes—ideal for any giftee, whether she prefers an understated look or loves bold, notice-me pieces. A low-profile latch-back closure provides a seamless fit, and for further customization, you have the choice of 18k gold vermeil or sterling silver."}, {"name": "Nintendo Switch 2 + Nintendo Switch Sports Resorts Bundle", "category": "Toys & Games", "price": 530.0, "retailer": "Best Buy", "shop": "$530 At Best Buy", "url": "https://bestbuy.7tiv.net/c/1201867/614286/10014?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.bestbuy.com%2Fproduct%2Fswitch-2-nintendo-switch-sports-resort-bundle%2FJ7GSL57W5Z%2Fsku%2F6691506", "description": "“The Nintendo Switch 2 bundle is a great option for families who want to play together,” says Rebecca Isaacs, tech and electronics editor. “It comes with a library of games, and in particular, the Sports Resort bundle includes a dozen fun sports-related games so you can box, bowl and practice your archery skills right in your living room.”"}, {"name": "Quince Cashmere Lined Leather Gloves", "category": "Little Luxuries", "price": 50.0, "retailer": "Quince", "shop": "$50 At Quince", "url": "https://goto.quince.com/c/1201867/1835359/21926?subId1=prd-6aedfb12858931eff1ebd517&u=https%3A%2F%2Fwww.quince.com%2Fwomen%2Fwomen-s-cashmere-lined-leather-gloves%3Fcolor%3Dchocolate%26gender%3Dwomen%26size%3Dm", "description": "“Winter gloves are always an appreciated gift, but this pair from Quince goes the extra mile,” says senior features and special projects editor Jennifer Ferrise. “Made with soft lambskin leather and lined in luxe, sustainably sourced cashmere, you can’t beat the warmth or the $50 price tag. Choose from three colors, and they come in men’s sizes, too.”"}, {"name": "Mondo Robotics Beni", "category": "Gadgets & Gear", "price": 749.0, "retailer": "Mondo Robotics", "shop": "$749 At Mondo Robotics", "url": "https://www.mondorobotics.com/products/beni-camera-robot", "description": "“I have been on a mission for years to find the softest throw, and the Comfrt Dreamer Blanket just knocked my leading pick out of the park,” says Amy Moran, senior home and kitchen editor. “It is silky soft, so comforting and easily the most sought-after blanket in our home.” Choose from four sizes and dozens of color options."}, {"name": "Comfrt Dreamer Blanket", "category": "Self-Care Staples", "price": 99.0, "retailer": "Comfrt", "shop": "$99 And Up At Comfrt", "url": "https://www.jdoqocy.com/click-8842431-17187243?sid=6ad7b29924b5da812673fc62&url=https%3A%2F%2Fcomfrt.com%2Fproducts%2Fthe-dreamer-blanket%3Fvariant%3D43830935617580", "description": "“The Beni robot can capture hands-free video for content creators with a 90-minute battery life—much longer than the average drone—and it also is just plain cute,” says Rebecca Isaacs, tech and electronics editor. “It can do a couple of tricks to impress friends, but its main draw is that it can follow you via voice commands and hand gestures.”"}, {"name": "Prada Hydrating Lip Balm", "category": "Little Luxuries", "price": 50.0, "retailer": "Sephora", "shop": "$50 At Sephora", "url": "https://click.linksynergy.com/deeplink?id=zmNbNw6aNM4&mid=2417&u1=6ad7b29924b5da812673fc62&murl=https%3A%2F%2Fwww.sephora.com%2Fproduct%2Fprada-beauty-moisturizing-lip-balm-P509710%3FskuId%3D2786093", "description": "Delivering up to 24 hours of moisture, Prada’s hydrating lip balm reacts with the wearer’s natural pH for a personalized custom finish. It’s designed to strengthen the lip barrier, too. Another luxurious touch: The balm comes in a gorgeous silver-toned Prada case that will thrill any fashion or beauty devotee."}, {"name": "Ray-Ban Meta Audio Clubmaster Glasses", "category": "Gadgets & Gear", "price": 429.0, "retailer": "Meta", "shop": "$429 And Up At Meta", "url": "https://metaaffiliatenetwork.pxf.io/c/1201867/3865253/51596?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.meta.com%2Fai-glasses%2Fray-ban-meta-audio-clubmaster-shiny-black-graphite-green-transitions%2F", "description": "Delighting the gadget lover in your life is easy with these stylish, camera-free frames that come with an array of audio features. The glasses have open-ear speakers and six microphones, allowing the wearer to listen to music, podcasts and news updates. They’re also an AI assistant: Just ask Meta to set reminders, access your schedule and more."}, {"name": "Tuckernuck Cashmere Knot Button Phoebe Cardigan", "category": "Little Luxuries", "price": 248.0, "retailer": "Tuckernuck", "shop": "$248 And Up At Tuckernuck", "url": "https://go.skimresources.com?id=106821X1564016&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Ftnuck.com%2Fproducts%2Fwheat-cashmere-knot-button-phoebe-cardigan", "description": "“Made from 100% cashmere, this soft Tuckernuck cardigan has cashmere-covered buttons that give it a vintage feel, while a monogram makes it personal,” says Micaela English, fashion and beauty writer. “I’d gift it to my mother-in-law or one of my closest friends—it’s special, and something they’ll still reach for long after the holidays.”"}, {"name": "Ghia Original Apéritif", "category": "Home & Holiday", "price": 38.0, "retailer": "Ghia", "shop": "$38 At Ghia", "url": "https://go.skimresources.com?id=106821X1564016&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Fdrinkghia.com%2Fproducts%2Fghia", "description": "A nonalcoholic drink in a beautiful, giftable bottle, Ghia’s Original Apéritif is much like an Italian amaro. Notes of orange, lemon balm and elderflower combine with Japanese yuzu to give it a taste profile that’s both bright and bitter. Pour one part Ghia and three parts bubbles—like sparkling water or tonic—into an ice-filled glass, then sit back and relax."}, {"name": "Louis Vuitton Horizon 55 Suitcase", "category": "Gadgets & Gear", "price": 3550.0, "retailer": "Louis Vuitton", "shop": "$3,550 At Louis Vuitton", "url": "https://us.louisvuitton.com/eng-us/products/horizon-55-monogram-nvprod6440157v/M13767?", "description": "Innovation and lightness describe this statement-making suitcase—sure to be a hit with the stylish jet-setter on your list. “Dreamed up by famed industrial designer Marc Newson, the carry-on has a flat interior and a large capacity to hold belongings for a short getaway,” says Jennifer Ferrise, senior features and special projects editor. “Get it monogrammed for a truly luxurious gift.”"}, {"name": "Caraway 10-Cup Coffee Maker", "category": "Home & Holiday", "price": 495.0, "retailer": "Caraway", "shop": "$495 At Caraway", "url": "https://caraway-home.pxf.io/c/1201867/1031872/13445?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.carawayhome.com%2Fproducts%2Fcoffee-maker%3FColor%3DCream", "description": "“The minimal, chic design of Caraway’s new coffee maker is even better in person—but it’s not all looks,” says Fran Sales, commerce writer. “Its materials are high-quality, especially the fully plastic-free internal brew path—water touches only glass and stainless steel from start to finish. I also love that the single-dial operation is intentionally simple—no apps or programming required.”"}, {"name": "Rhode Highlight Milk", "category": "Little Luxuries", "price": 28.0, "retailer": "Rhode", "shop": "$28 At Rhode", "url": "https://rhodeskin.sjv.io/c/1201867/1658273/19254?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.rhodeskin.com%2Fproducts%2Fhighlight-milk-01", "description": "Add some shimmer to the holidays with a cult-favorite luminizer that delivers a lit-from-within glow. “I love the Rhode Highlight Milk because it adds a little sparkle without looking like makeup,” says Micaela English, fashion and beauty writer. “Gift it to a teen just dipping her toe into beauty, and you’re instantly the cool one.”"}, {"name": "Solo Stove S'mores Bundle", "category": "Home & Holiday", "price": 85.0, "retailer": "Solo Stove", "shop": "$85 At Solo Stove", "url": "https://solostove.pxf.io/c/1201867/992090/13024?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.solostove.com%2Fus%2Fen-us%2Fp%2Fsmores-kit%3Fsku%3DSSBOWL-SMRGFTEL-NTR", "description": "No campfire is necessary with this S’mores Bundle from Solo Stove: A sturdy concrete and metal fire bowl is the centerpiece of this kit, safe for indoor or outdoor use. The set includes smokeless gel fuel, four skewers, an ingredient tray and a s’mores recipe book for making the perfect dessert, no matter the time of year."}, {"name": "Vacanza Cap Ferrat Eau De Parfum", "category": "Little Luxuries", "price": 160.0, "retailer": "Nordstrom", "shop": "$160 At Vacanza", "url": "https://vacanzafragrances.com/products/cap-ferrat-fragrance-scent-perfume?", "description": "“Created by Frank Voelkl, the perfumer behind cult favorites like Le Labo Santal 33, Vacanza’s Cap Ferrat has a fresh, sophisticated scent that’s beautiful when worn alone or layered with deeper notes,” says deputy editor Jane Sung. “It’s topped with a handcrafted natural stone cap that doubles as a room diffuser when you spritz a little fragrance onto it.”"}, {"name": "Pistakio The \"Cream\" And \"Crunch\" Duo", "category": "Home & Holiday", "price": 30.0, "retailer": "Pistakio", "shop": "$30 At Pistakio", "url": "https://pistakio.co/products/the-pistakio-duo", "description": "\"The pistachio nut has taken over, evidenced by the ever-viral Dubai chocolate, ultra-luxurious pistachio milk lattes and green-hued pistachio cookie recipes galore across the internet,” says Brinda Ayer, editorial director. “Pistakio's duo of pistachio creams are for fans who are equal-opportunity crunchy and creamy appreciators. Slather on toast, heap onto oatmeal or just eat it straight from a spoon.\""}, {"name": "NeeDoh Nice Cube", "category": "Toys & Games", "price": 30.0, "retailer": "Walmart", "shop": "$30 At Walmart", "url": "https://goto.walmart.com/c/1201867/565706/9383?subId1=6ad7b29924b5da812673fc62&veh=aff&sourceid=imp_000011112222333344&u=https%3A%2F%2Fwww.walmart.com%2Fip%2FNee-doh-Nice-Cube-Satisfying-Square-Shaped-Sensory-1-piece-random-color%2F20075151688%3F", "description": "“Squishy toys are huge, and gifting a kid an authentic NeeDoh will be the highlight of their holiday,” says Alicia Betz, baby and kids gear writer. “They love to squish and collect them, and they’re truly a hit with kids of all ages, from elementary-schoolers to teens.”"}, {"name": "John Derian Green Grapes Ornament", "category": "Home & Holiday", "price": 34.0, "retailer": "John Derian", "shop": "$34 At John Derian", "url": "https://www.johnderian.com/products/grape-green-ornament?_pos=7&_sid=95de4901b&_ss=r", "description": "“I like a host gift that isn’t the usual bottle of wine,” says Micaela English, fashion and beauty writer. “A John Derian ornament feels festive, and I always add a note about the symbolism behind it: Grapes represent abundance and good fortune. Consider it a shimmering little omen for 2027.”"}, {"name": "Amazon Kindle Paperwhite Signature Edition", "category": "Gadgets & Gear", "price": 250.0, "retailer": "Amazon", "shop": "$250 At Amazon", "url": "https://www.amazon.com/dp/B0GHT67RG2?lv=shuf&channelId=500&plpRedirect=mhFallback&th=1&linkCode=ll2&tag=6ad7b29924b5da812673fc62-20&linkId=69538c1637ea748255f5ef06b65c6227&language=en_US&gaOptInStatus=true&ref_=as_li_ss_tl", "description": "“The new Amazon Kindle Paperwhite features a luxurious aluminum back plate that allows you to magnetically connect Amazon-branded cases, including the Kindle Page Turn Cover,” says Rebecca Isaacs, tech and electronics editor. “It turns pages 30% faster, and the enhanced contrast makes the screen brighter and the text crisper.”"}, {"name": "Strathberry Mosaic Nano", "category": "Little Luxuries", "price": 635.0, "retailer": "Strathberry", "shop": "$635 At Strathberry", "url": "https://go.skimresources.com?id=106821X1564016&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Fus.strathberry.com%2Fproducts%2Fmosaic-nano-lime-suedekhaki", "description": "Impeccably chic and versatile, Strathberry’s Mosaic Nano bag can be carried by its top handle or worn as a crossbody with its detachable, adjustable strap. Choose from 100% grain calfskin leather or Italian cow suede—plus, it comes in a whopping 15 colors to suit any recipient’s vibe. Opt to add a leather tag and personalize it with your giftee’s initials."}, {"name": "Raaka Chocolate Library Gift Box", "category": "Home & Holiday", "price": 65.0, "retailer": "Amazon", "shop": "$65 At Amazon", "url": "https://www.amazon.com/dp/B08LP53Y72?plpRedirect=mhFallback&linkCode=ll2&tag=6ad7b29924b5da812673fc62-20&linkId=c57aea17fa6d34fd5ca414d8f6a1d162&language=en_US&gaOptInStatus=true&ref_=as_li_ss_tl", "description": "“I’ve tried a lot of chocolate brands in my life, and Raaka always remains one I return to,” says Monica Petrucci, home and kitchen editor. “Its unroasted, single-origin chocolate is worth splurging on, and that’s what makes this library box the perfect gift. It includes eight of the brand’s popular bars, from classic Pink Sea Salt to unique Bananas Foster.”"}, {"name": "Stapelstein Wonder Edition Rainbow Set", "category": "Toys & Games", "price": 349.0, "retailer": "Stapelstein", "shop": "$349 At Stapelstein", "url": "https://www.awin1.com/cread.php?awinmid=58835&awinaffid=1944237&campaign=&clickref=6ad7b29924b5da812673fc62&ued=https%3A%2F%2Fstapelstein.com%2Fproducts%2Fwonder-edition-rainbow-set%3Fpb%3D0&platform=pl", "description": "Let kids’ imaginations run wild by giving them an entire limited-edition set of Wonder Editions: one balance board and six originals, all perfect for balancing on, building with, sitting on and any number of activities, depending on where their creativity takes them. Each one is made from lightweight, durable expandable polypropylene, usable both indoors and out."}, {"name": "Fossil Raquel Three Hand Date Stainless Steel Watch", "category": "Little Luxuries", "price": 195.0, "retailer": "Fossil", "shop": "$195 At Fossil", "url": "https://www.anrdoezrs.net/click-8842431-11556884?sid=6ad7b29924b5da812673fc62&url=https%3A%2F%2Fwww.fossil.com%2Fen-us%2Fproducts%2Fraquel-23mm-three-hand-date-gold-tone-stainless-steel-watch%2FES5220.html%3F", "description": "A sleek, subtle wristwatch is a classic gift that never goes out of style. Inspired by vintage cocktail watches, the Raquel comes in nine color combos—including classic gold, rose gold and black—and looks right at home with any outfit, from a t-shirt and jeans to a cocktail dress."}, {"name": "Sonos Ace Ultra", "category": "Gadgets & Gear", "price": 449.0, "retailer": "Sonos", "shop": "$449 At Sonos", "url": "https://sonos.sjv.io/c/1201867/2804767/32256?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.sonos.com%2Fen-us%2Fshop%2Fsonos-ace-ultra", "description": "Audiophiles will love Sonos’ new headphones: Ten microphones filter out noise, and even with ANC on, you get 35 hours of listening time. For full immersion in music and movies, the brand tapped Grammy- and Oscar-winning engineers to tune the headphones’ driver. Plus, just one press of a button delivers what’s playing on your speakers to the headphones and back again."}, {"name": "Lodge Custom Engraved Text Skillet", "category": "Home & Holiday", "price": 100.0, "retailer": "Lodge Cast Iron", "shop": "$100 At Lodge Cast Iron", "url": "https://go.skimresources.com?id=106821X1564016&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Fwww.lodgecastiron.com%2Fproducts%2Fcustom-skillets", "description": "“Thoughtful, unexpected, beautiful, useful—this gift checks all the boxes,” says Karen Tietjen, senior commerce optimization strategist. “Choose a design, font and text to turn this gorgeous cast iron pan into a one-of-a-kind gift. I received one as a housewarming gift with our new address and the year, and it felt so special.”"}, {"name": "Therabody Theragun Mini", "category": "Gadgets & Gear", "price": 230.0, "retailer": "Therabody", "shop": "$230 At Therabody", "url": "https://theragun.xibx.net/c/1201867/617418/10041?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.therabody.com%2Fproducts%2Ftheragun-mini-strawberry-splash%3Foption%3Dstrawberry-splash", "description": "Therabody’s lightest massage gun, the Theragun Mini, is now available in a slew of new colors. The brand’s Y2K Collection offers five bold hues, powered by the same technology that helps relieve aches in a flash. “It’s small yet delivers the most power of all the mini massagers we tested,” says Jennifer Ferrise, senior features and special projects editor."}, {"name": "Algae Cooking Club Musashi's Smoked Tomato Oil", "category": "Home & Holiday", "price": 28.0, "retailer": "Algae Cooking Club", "shop": "$28 At Algae Cooking Club", "url": "ht  hard to create,” says Jennifer Ferrise, senior features and special projects editor. “Even better, it lasts all day.”"}, {"name": "Skoot SkootCase", "category": "Toys & Games", "price": 225.0, "retailer": "Skoot", "shop": "$225 At Skoot", "url": "https://go.skimresources.com/?id=106821X1765005&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Fgoskoot.com%2Fproducts%2Fskootcase%3Fvariant%3D44263401980039", "description": "Traveling with the family doesn’t get any more fun than with this combination suitcase and scooter, which lets kids ride, explore and blow off steam on even the most stressful trip. The 40L hardshell carry-on has a detachable design and can morph into a pullable suitcase, luggage only or a stand-alone scooter. Choose from six colors."}, {"name": "Therabody TheraFace Mask", "category": "Self-Care Staples", "price": 650.0, "retailer": "Therabody", "shop": "$650 At Therabody", "url": "https://theragun.xibx.net/c/1201867/617418/10041?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.therabody.com%2Fproducts%2Ftheraface-mask-blush-pink%3F", "description": "Now available in Blush Pink—a limited-edition color—Therabody’s popular LED face mask uses 648 full-face red, infrared and blue lights (plus vibration therapy) to reduce fine lines, boost collagen, fight acne and more. “I’ve been using my TheraFace for a year and it has significantly improved the clarity of my skin,” says Jennifer Ferrise, senior features and special projects editor."}, {"name": "Snow", "category": "Home & Holiday", "price": 45.0, "retailer": "Amazon", "shop": "$45 At Amazon", "url": "https://www.amazon.com/dp/1419791788?&linkCode=ll2&tag=6ad7b29924b5da812673fc62-20&linkId=0e0dd3c792263c46e880bc30083cc04d&language=en_US&gaOptInStatus=true&ref_=as_li_ss_tl", "description": "Winter has never looked so luxurious: Celebrated author and photographer Gray Malin’s collection of snowscapes captures the globe’s most famous snowy destinations, from Aspen to Zermatt—and even Antarctica. It’s the perfect way to curl up by the fire and appreciate the beauty of the season."}, {"name": "Ilia Beauty The Ethereal Baked Face Palette", "category": "Little Luxuries", "price": 59.0, "retailer": "Sephora", "shop": "$59 At Sephora", "url": "https://click.linksynergy.com/deeplink?id=zmNbNw6aNM4&mid=2417&u1=6ad7b29924b5da812673fc62&murl=https%3A%2F%2Fwww.sephora.com%2Fproduct%2Fexclusive-ethereal-palette-P526402%3F", "description": "This limited-edition highlighter, bronzer and blush palette was inspired by the California coast’s flora. Infused with smoothing edelweiss extract and hydrating winged kelp extract, the shades—with apropos names like Ripple, Swell, Rush and Dune—use light-filtering powders to blur and smooth skin."}, {"name": "Gathre Trampoline", "category": "Toys & Games", "price": 160.0, "retailer": "West Elm", "shop": "$160 At West Elm", "url": "https://westelm.e54b.net/c/1201867/267856/4336?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.westelm.com%2Fproducts%2Fgathre-trampoline-d18561%2F", "description": "“You’d be hard-pressed to find a more beautiful indoor trampoline,” says Rebekah Lowin, deputy editor. “Gathre’s understated design blends right in with your existing décor, unlike so many of the louder, more colorful kids’ products out there. There’s always a place for color in a playroom, but it’s nice to have an option that doesn’t dominate the space.”"}, {"name": "Loewe Ivy Liquid Soap", "category": "Little Luxuries", "price": 90.0, "retailer": "Saks Fifth Avenue", "shop": "$90 At Saks Fifth Avenue", "url": "https://go.skimresources.com/?id=106821X1564016&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Fwww.saksfifthavenue.com%2Fproduct%2Floewe-perfumes-ivy-liquid-soap-0400001589532.html%3F", "description": "“Loewe's Ivy Liquid Soap makes mundane handwashing feel a little more special,” says Jane Sung, deputy editor. “I love its green, woody scent, that's both earthy and sophisticated without lingering too heavily on the skin. The weighty bottle is simple but gorgeous, and it's a lovely addition to a bathroom sink.”"}, {"name": "Tiny Tags Oval Locket Necklace", "category": "Little Luxuries", "price": 240.0, "retailer": "Tiny Tags", "shop": "$240 And Up At Tiny Tags", "url": "https://go.skimresources.com/?id=106821X1564016&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Ftinytags.com%2Fproducts%2Foval-locket-necklace%3F", "description": "“This locket updates an heirloom classic for everyday wear,” says Jennifer Ferrise, senior features and special projects editor. “The oval pendant opens to hold two tiny photos or another small keepsake, and you can add engraving to make it even more personal. It’s a sentimental gift for a new mom, grandmother or anyone who likes to keep their people close.”"}, {"name": "Tin Can", "category": "Toys & Games", "price": 100.0, "retailer": "Tin Can", "shop": "$100 At Tin Can", "url": "https://go.skimresources.com/?id=106821X1765005&xs=1&xcust=6ad7b29924b5da812673fc62&url=https%3A%2F%2Ftincan.kids%2Fproducts%2Ftin-can", "description": "Give kids a blast from the past with this Wi-Fi–enabled landline that lets them chat with their friends. Only parent-approved numbers can call in or out, and the phone has no texting, no social media and no browser: just actual buttons to push and a cord to twirl."}, {"name": "Olive Tree Frantoio Variety", "category": "Home & Holiday", "price": 99.0, "retailer": "Plantogram", "shop": "$99 At Plantogram", "url": "https://plantogram.com/product/olive_frantoio/", "description": ""}, {"name": "Ascari Cocktail Shaker Gift Set", "category": "Home & Holiday", "price": 205.0, "retailer": "CB2", "shop": "$205 At CB2", "url": "https://cb2.pxf.io/c/1201867/1752687/20480?subId1=6ad7b29924b5da812673fc62&u=https%3A%2F%2Fwww.cb2.com%2Fascari-cocktail-shaker-gift-set%2Fs431770", "description": ""}, {"name": "Bose SoundLink Micro Portable Speaker (2nd Gen)", "category": "Gadgets & Gear", "price": 129.0, "retailer": "Amazon", "shop": "$129 At Amaz roducts%2Fmeater-pro", "description": ""}];
const PAGE = 20;
let shown = PAGE;

const grid = document.getElementById('grid');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function list() {
  const cat = document.getElementById('cat').value;
  const sort = document.getElementById('sort').value;
  let g = GIFTS.map((x, i) => ({ x, i })).filter(({ x }) => !cat || cat === 'All' || x.category === cat);
  if (sort === 'low') g.sort((a, b) => a.x.price - b.x.price || a.i - b.i);
  if (sort === 'high') g.sort((a, b) => b.x.price - a.x.price || a.i - b.i);
  return g.map(o => o.x);
}

function draw() {
  const all = list(), vis = all.slice(0, shown);
  grid.innerHTML = vis.map(x => {
    const shop = `<a class="shop" href="${esc(x.url)}" target="_blank" rel="noopener sponsored">${esc(x.shop)}</a>`;
    const desc = x.description
      ? `<div class="desc">${x.description.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}</div>` : '';
    return `<article class="card"><h6>${esc(x.name)}</h6>${desc}${shop}</article>`;
  }).join('');
  document.getElementById('count').textContent = `Showing ${vis.length} of ${all.length} gifts`;
  document.getElementById('more').style.display = vis.length < all.length ? '' : 'none';
}

document.getElementById('cat').addEventListener('change', () => { shown = PAGE; draw(); });
document.getElementById('sort').addEventListener('change', () => { shown = PAGE; draw(); });
document.getElementById('more').addEventListener('click', () => { shown += PAGE; draw(); });
draw();
</script>
