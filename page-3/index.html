const PAGE = 20;
let shown = PAGE;

const grid = document.getElementById('grid');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function list() {
  const cat = document.getElementById('cat').value;
  const sort = document.getElementById('sort').value;
  let g = GIFTS.map((x, i) => ({ x, i })).filter(({ x }) => !cat || cat === 'All' || x.category === cat);
  if (sort === 'low') g.sort((a, b) => a.x.price - b.x.price || a.i - b.i);
  if (sort === 'high') g.sort((a, b) => b.x.price - a.x.price || a.i - b.i);
  return g.map(o => o.x);
}

function draw() {
  const all = list(), vis = all.slice(0, shown);
  grid.innerHTML = vis.map(x => {
    const shop = `<a class="shop" href="${esc(x.url)}" target="_blank" rel="noopener sponsored">${esc(x.shop)}</a>`;
    const quote = x.description
      ? `<div class="quote" tabindex="0">${x.description.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}${shop}</div>` : '';
    return `<article class="card${x.description ? ' has-quote' : ''}"><h6>${esc(x.name)}</h6><span class="more">Read More</span>${shop}${quote}</article>`;
  }).join('');
  document.getElementById('count').textContent = `Showing ${vis.length} of ${all.length} gifts`;
  document.getElementById('more').style.display = vis.length < all.length ? '' : 'none';
}

document.getElementById('cat').addEventListener('change', () => { shown = PAGE; draw(); });
document.getElementById('sort').addEventListener('change', () => { shown = PAGE; draw(); });
document.getElementById('more').addEventListener('click', () => { shown += PAGE; draw(); });
draw();
</script>
